<!DOCTYPE html>
<html lang="en">
<head>
    

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Hibur+Mono&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<body>

     <div class="display"> </div>

         <button>7</button>
         <button>8</button>
         <button>9</button>
         <button>÷</button> 
         <button>4</button>
         <button>5</button>
         <button>6</button>
         <button>×</button>
         <button>1</button>
         <button>2</button>
         <button>3</button>
         <button>-</button>
         <button>0</button>
         <button>.</button>
         <button>=</button>
         <button>+</button>
         <button>⌫</button>

    </div>

    <script src="index.js"></script>
